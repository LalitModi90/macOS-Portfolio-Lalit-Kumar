<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="codeyx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24242e"/>
      <stop offset="100%" stop-color="#121217"/>
    </linearGradient>
    <filter id="codeyx-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#codeyx-bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <g transform="translate(100, 100) scale(3.12)" filter="url(#codeyx-shadow)">
    <!-- Outer C shape (white) -->
    <path d="M60 22 C30 22 20 32 20 50 C20 68 30 78 60 78" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    
    <!-- Yellow X shape -->
    <path d="M52 22 L82 78 M82 22 L52 78" fill="none" stroke="#FACC15" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Lightbulb inside C -->
    <circle cx="36" cy="46" r="13" fill="#18181b" stroke="#FACC15" stroke-width="3" />
    <path d="M31 57 H41 M33 61 H39" stroke="#FACC15" stroke-width="3" stroke-linecap="round" />
    
    <!-- Code brackets </> inside bulb -->
    <path d="M30 46 L27 44 M30 46 L27 48" stroke="#FACC15" stroke-width="2" stroke-linecap="round" />
    <line x1="37" y1="42" x2="35" y2="50" stroke="#FACC15" stroke-width="2" stroke-linecap="round" />
    <path d="M42 44 L45 46 M42 48 L45 46" stroke="#FACC15" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
