  <rect x="60" y="58" width="3" height="3" fill="#38BDF8" />
  <rect x="65" y="58" width="3" height="3" fill="#38BDF8" />
  <rect x="70" y="58" width="3" height="3" fill="#38BDF8" />

  <!-- Bottom Brand Text Representation -->
